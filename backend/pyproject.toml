[project]
name = "cenli-dpe-backend"
version = "1.0.0"
description = "Cenli DPE Agent — Gemini + Arize Phoenix guardrail pipeline backend"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
